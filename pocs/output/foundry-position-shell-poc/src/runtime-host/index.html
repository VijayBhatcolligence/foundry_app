<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CRITICAL SECURITY: Strict Content Security Policy -->
  <!-- Prevents unauthorized script execution, XSS, and data exfiltration -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'unsafe-inline' 'unsafe-eval';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data: https:;
                 connect-src 'self';
                 font-src 'self';
                 object-src 'none';
                 media-src 'self';
                 frame-src 'none';
                 base-uri 'self';
                 form-action 'self';">

  <title>Foundry Runtime Host</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    #runtime-host-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #runtime-status {
      padding: 8px 16px;
      background: #1976d2;
      color: white;
      font-size: 12px;
      font-weight: 500;
    }

    #module-container {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-container {
      padding: 32px;
      text-align: center;
    }

    .error-message {
      color: #d32f2f;
      font-weight: 500;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div id="runtime-host-container">
    <div id="runtime-status">Runtime Host: Initializing...</div>
    <div id="module-container">
      <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div>Loading runtime...</div>
      </div>
    </div>
  </div>

  <!-- Runtime Host JavaScript -->
  <script type="module" src="/runtime-host.js"></script>
</body>
</html>
