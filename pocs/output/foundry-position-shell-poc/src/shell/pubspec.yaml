name: foundry_shell
description: Foundry Position Shell - Flutter custody layer for position-based modules
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView integration for runtime host
  webview_flutter: ^4.4.0
  webview_flutter_android: ^3.12.0
  webview_flutter_wkwebview: ^3.9.0

  # Secure storage for shell tokens
  flutter_secure_storage: ^9.0.0

  # JSON handling
  json_annotation: ^4.8.1

  # Crypto for bootstrap code generation
  crypto: ^3.0.3

  # UUID generation
  uuid: ^4.2.1

  # Path manipulation and provider
  path_provider: ^2.1.0
  path: ^1.8.3

  # New for Phase 2: Module update system
  pointycastle: ^3.7.0      # RSA signature verification
  http: ^1.1.0              # Module downloads
  pub_semver: ^2.1.0        # Version comparison
  sqflite: ^2.3.0           # SQLite for failure tracking and last-known-good
  connectivity_plus: 5.0.0

  # Phase 5: Camera/Scanner integration
  mobile_scanner: ^5.0.0    # Barcode and QR code scanning
  permission_handler: ^11.0.0  # Camera permission management

  # Phase 5.1: Photo capture
  camera: ^0.10.0           # Still photo capture
  image: ^4.0.0             # Image processing and compression

  # Phase 1: Local HTTP Server
  shelf: ^1.4.1             # HTTP server framework
  shelf_static: ^1.1.2      # Static file serving

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  integration_test:
    sdk: flutter
  mockito: ^5.4.0           # Mock generation for tests

flutter:
  uses-material-design: true
  assets:
    - assets/modules/test-inventory-checker/dist/index.html
    - assets/modules/test-inventory-checker/dist/bundle.js
    - assets/modules/test-inventory-checker/dist/bundle.js.map
    - assets/modules/test-quality-inspector/dist/index.html
    - assets/modules/test-quality-inspector/dist/bundle.js
    - assets/modules/test-quality-inspector/dist/bundle.js.map
    - assets/modules/shared/bridge_helper.js
    - assets/modules/shared/ActionQueueGlobal.js
    - assets/modules/shared/ReferenceDataManager.js
    - assets/modules/shared/SyncManager.js
