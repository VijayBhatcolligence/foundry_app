name: foundry_shell
description: Foundry Position Shell - Flutter custody layer for position-based modules
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView integration for runtime host
  webview_flutter: ^4.4.0
  webview_flutter_android: ^3.12.0
  webview_flutter_wkwebview: ^3.9.0

  # Secure storage for shell tokens
  flutter_secure_storage: ^9.0.0

  # JSON handling
  json_annotation: ^4.8.1

  # Crypto for bootstrap code generation
  crypto: ^3.0.3

  # UUID generation
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
