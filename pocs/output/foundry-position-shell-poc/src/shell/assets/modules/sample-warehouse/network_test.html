<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .test {
            margin: 10px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fafafa;
        }
        .test.running {
            background: #fff9c4;
            border-color: #fbc02d;
        }
        .test.pass {
            background: #e8f5e9;
            border-color: #4caf50;
        }
        .test.fail {
            background: #ffebee;
            border-color: #f44336;
        }
        .test-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .test-details {
            font-size: 14px;
            color: #666;
        }
        .test-details div {
            margin: 4px 0;
        }
        .status-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            border-radius: 50%;
            margin-right: 8px;
        }
        .pass .status-icon {
            background: #4caf50;
            color: white;
        }
        .fail .status-icon {
            background: #f44336;
            color: white;
        }
        .running .status-icon {
            background: #fbc02d;
            color: white;
        }
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .info-box h3 {
            color: #1976d2;
            margin-bottom: 8px;
        }
        .info-box p {
            color: #555;
            line-height: 1.6;
            margin: 4px 0;
        }
        button {
            background: #2196f3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            margin-top: 20px;
        }
        button:hover {
            background: #1976d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Network Connectivity Test</h1>

        <div class="info-box">
            <h3>Test Purpose</h3>
            <p>This page tests if the WebView can make HTTP requests to the backend server.</p>
            <p><strong>Backend:</strong> http://192.168.0.163:3000</p>
            <p><strong>Expected:</strong> All tests should pass if device is on the same network as backend.</p>
        </div>

        <button onclick="runTests()">Run Tests</button>

        <div id="results"></div>
    </div>

    <script>
        const tests = [
            {
                name: 'Backend Health Check',
                url: 'http://192.168.0.163:3000/api/health',
                method: 'GET',
                description: 'Tests if backend /api/health endpoint is reachable'
            },
            {
                name: 'Backend Transactions Endpoint',
                url: 'http://192.168.0.163:3000/api/transactions',
                method: 'GET',
                description: 'Tests if backend /api/transactions endpoint is reachable'
            },
            {
                name: 'Google (HTTPS Test)',
                url: 'https://www.google.com',
                method: 'GET',
                description: 'Tests if HTTPS connections work (should always pass)'
            },
        ];

        async function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2 style="margin-top: 20px; color: #333;">Test Results</h2>';

            for (let i = 0; i < tests.length; i++) {
                const test = tests[i];

                // Create test element
                const testEl = document.createElement('div');
                testEl.className = 'test running';
                testEl.id = `test-${i}`;
                testEl.innerHTML = `
                    <div class="test-name">
                        <span class="status-icon">...</span>
                        ${test.name}
                    </div>
                    <div class="test-details">
                        <div><strong>URL:</strong> ${test.url}</div>
                        <div><strong>Method:</strong> ${test.method}</div>
                        <div><strong>Status:</strong> Testing...</div>
                    </div>
                `;
                results.appendChild(testEl);

                try {
                    const start = Date.now();
                    const response = await fetch(test.url, {
                        method: test.method,
                        headers: test.method === 'POST' ? { 'Content-Type': 'application/json' } : {}
                    });
                    const duration = Date.now() - start;

                    // Parse response
                    let responseText = '';
                    try {
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            const json = await response.json();
                            responseText = JSON.stringify(json, null, 2);
                        } else {
                            responseText = await response.text();
                            if (responseText.length > 100) {
                                responseText = responseText.substring(0, 100) + '...';
                            }
                        }
                    } catch (e) {
                        responseText = '(Could not parse response)';
                    }

                    // Update test element
                    testEl.className = 'test pass';
                    testEl.innerHTML = `
                        <div class="test-name">
                            <span class="status-icon">✓</span>
                            ${test.name}
                        </div>
                        <div class="test-details">
                            <div><strong>URL:</strong> ${test.url}</div>
                            <div><strong>Method:</strong> ${test.method}</div>
                            <div><strong>Status:</strong> ${response.status} ${response.statusText}</div>
                            <div><strong>Time:</strong> ${duration}ms</div>
                            <div><strong>Response:</strong> <pre style="margin-top: 8px; padding: 8px; background: #f5f5f5; border-radius: 4px; overflow-x: auto; font-size: 12px;">${responseText}</pre></div>
                        </div>
                    `;
                } catch (error) {
                    // Test failed
                    testEl.className = 'test fail';
                    testEl.innerHTML = `
                        <div class="test-name">
                            <span class="status-icon">✗</span>
                            ${test.name}
                        </div>
                        <div class="test-details">
                            <div><strong>URL:</strong> ${test.url}</div>
                            <div><strong>Method:</strong> ${test.method}</div>
                            <div><strong>Status:</strong> FAILED</div>
                            <div><strong>Error:</strong> ${error.message}</div>
                            <div style="margin-top: 8px; color: #c62828;">
                                <strong>Troubleshooting:</strong><br>
                                ${test.url.includes('192.168.0.163') ?
                                    '• Check device WiFi - must be on same network (192.168.0.x)<br>' +
                                    '• Check backend is running on PC: http://192.168.0.163:3000<br>' +
                                    '• Check Windows Firewall allows port 3000<br>' +
                                    '• Check router AP isolation is disabled'
                                    :
                                    '• This is an HTTPS test - it should always work<br>' +
                                    '• If this fails, check device internet connection'
                                }
                            </div>
                        </div>
                    `;
                }

                // Small delay between tests
                await new Promise(resolve => setTimeout(resolve, 100));
            }
        }

        console.log('[Network Test] Page loaded');
        console.log('[Device Info] User Agent:', navigator.userAgent);
        console.log('[Device Info] Platform:', navigator.platform);
    </script>
</body>
</html>
