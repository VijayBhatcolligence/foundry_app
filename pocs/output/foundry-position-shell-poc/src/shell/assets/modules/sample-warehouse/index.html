                    if (navigator.onLine && syncManagerRef && syncManagerRef.current) {
                        syncManagerRef.current.downloadWaterChecks().catch(err => {
                            console.warn('[LocalDB] Background sync failed:', err);
                        });
                    }

                } catch (err) {
                    console.error('Failed to load water temp history:', err);
                    setBackendStatus('error');
                }
            };

            const loadComplaintsHistory = async () => {
                try {
                    // ✅ READ FROM LOCAL DB (Single Source of Truth)
                    console.log('[LocalDB] Loading complaints history from IndexedDB...');

                    if (!offlineDB) {
                        console.warn('[LocalDB] Database not ready');
                        return;
                    }

                    // Always read from IndexedDB (works offline!)
                    const complaints = await offlineDB.complaints
                        .orderBy('createdAt')
                        .reverse()
                        .limit(50)
                        .toArray();

                    console.log('[LocalDB] ✅ Loaded', complaints.length, 'complaints from IndexedDB');
                    setComplaints(complaints);
                    setBackendStatus('connected');

                    // Background refresh if online
                    if (navigator.onLine && syncManagerRef && syncManagerRef.current) {
                        syncManagerRef.current.downloadComplaints().catch(err => {
                            console.warn('[LocalDB] Background sync failed:', err);
                        });
                    }

                } catch (err) {
                    console.error('Failed to load complaints history:', err);
                    setBackendStatus('error');
                }
            };

            const addLineItem = () => {
                if (transaction.lineItems.length >= 50) {
                    setMessage({ type: 'error', text: 'Maximum 50 line items reached' });
                    return;
                }

                setTransaction(prev => ({
                    ...prev,
                    lineItems: [...prev.lineItems, {
                        id: Date.now(),
                        sku: '',
                        description: '',
                        quantity: '',
                        location: '',
                        photos: []
                    }]
                }));
            };

            const removeLineItem = (id) => {
                setTransaction(prev => ({
                    ...prev,
                    lineItems: prev.lineItems.filter(item => item.id !== id)
                }));
            };

            const updateLineItem = (id, field, value) => {
                setTransaction(prev => ({
                    ...prev,
                    lineItems: prev.lineItems.map(item =>
                        item.id === id ? { ...item, [field]: value } : item
                    )
                }));
            };

            // Offline database helpers
            const loadPendingTransactions = async () => {
                if (!offlineDB) return;

                try {
                    const pending = await offlineDB.transactions
                        .where('syncStatus')
                        .anyOf(['pending', 'syncing', 'failed'])
                        .reverse()
                        .sortBy('createdAt');

                    setPendingTransactions(pending);
                } catch (error) {
                    console.error('[App] Failed to load pending transactions:', error);
                }
            };

            const updateSyncStatus = async () => {
                if (syncManagerRef.current) {
                    const status = await syncManagerRef.current.getSyncStatus();
                    setSyncStatus(status);
                }
            };

            const handleManualSync = async () => {
                if (syncManagerRef.current) {
                    console.log('[App] Manual sync triggered - syncing all types');

                    // Upload pending
                    await syncManagerRef.current.syncPendingTransactions();
                    await syncManagerRef.current.syncPendingWaterChecks();
                    await syncManagerRef.current.syncPendingComplaints();

                    // Download updates
                    await syncManagerRef.current.downloadAllData();

                    await loadPendingTransactions();
                    await updateSyncStatus();
                }
            };

            // Water temp handlers
            const generateTemp = () => {
                const fahrenheit = Math.floor(Math.random() * 21) + 60; // 60-80°F
                const celsius = Math.round((fahrenheit - 32) * 5 / 9);
                setTempF(fahrenheit);
                setTempC(celsius);
                setMessage({ type: 'success', text: `Temperature: ${fahrenheit}°F (${celsius}°C)` });
            };

            const captureTempPhoto = async () => {
                if (!isBridgeReady()) {
                    setMessage({ type: 'error', text: 'Photo capture not available' });
                    return;
                }

                try {
                    setIsSubmitting(true);
                    setMessage({ type: 'info', text: 'Opening camera...' });

                    const photoResult = await window.shellBridge.capturePhoto('water-temp-' + Date.now());

                    if (photoResult.data && photoResult.data.success) {
                        setTempPhoto(photoResult.data);
                        setMessage({ type: 'success', text: 'Photo captured' });
                    } else {
                        setMessage({ type: 'error', text: 'Photo capture failed' });
                    }
                } catch (err) {
                    setMessage({ type: 'error', text: `Photo error: ${err.message}` });
                } finally {
                    setIsSubmitting(false);
                }
            };

            const submitTempCheck = async () => {
                if (!tempF || !tempPhoto) {
                    setMessage({ type: 'error', text: 'Temperature and photo are required' });
                    return;
                }

                try {
                    setIsSubmitting(true);

                    const waterCheckData = {
                        id: 'wt-' + Date.now(),
                        temp_fahrenheit: tempF,
                        temp_celsius: tempC,
                        location: tempLocation || null,
                        photo_path: tempPhoto.photoPath,
                        timestamp: Date.now(),
                        syncStatus: 'pending',
                        retryCount: 0,
                        lastError: null,
                        lastSyncAttempt: null,
                        createdAt: Date.now()
                    };

                    // Save to IndexedDB (offline-first)
                    console.log('[App] Water check - Submit check: dbReady =', dbReady, ', offlineDB =', !!offlineDB);

                    if (dbReady && offlineDB) {
                        console.log('[App] ✅ Saving water check to IndexedDB...');
                        await offlineDB.waterchecks.add(waterCheckData);
                        console.log('[App] ✅ Water check saved to IndexedDB');

                        setMessage({
                            type: 'success',
                            text: `Water check saved! ${networkOnline ? 'Syncing...' : 'Will sync when online.'}`
                        });

                        // Trigger sync if online
                        if (networkOnline && syncManagerRef.current) {
                            setTimeout(() => {
                                syncManagerRef.current.syncPendingWaterChecks();
                            }, 500);
                        }
                    } else {
                        // Fallback to direct HTTP
                        console.warn('[App] ❌ IndexedDB not ready for water check, using direct HTTP');
                        const url = 'http://192.168.0.163:3000/api/water-temp';
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(waterCheckData)
                        });

                        if (!response.ok) {
                            throw new Error('Failed to save water check');
                        }
                        setMessage({ type: 'success', text: 'Water check saved via HTTP!' });
                    }

                    setTimeout(() => {
                        setActiveView('menu');
                        // Reset form
                        setTempF(null);
                        setTempC(null);
                        setTempPhoto(null);
                        setTempLocation('');
                        setMessage(null);
                    }, 2000);

                } catch (err) {
                    console.error('Water check submit error:', err);
                    setMessage({ type: 'error', text: `Error: ${err.message}` });
                } finally {
                    setIsSubmitting(false);
                }
            };

            // Complaint handlers
            const scanComplaintBarcode = async () => {
                if (!isBridgeReady()) {
                    setMessage({ type: 'error', text: 'Scanner not available' });
                    return;
                }

                try {
                    setIsSubmitting(true);
                    setMessage({ type: 'info', text: 'Opening scanner...' });

                    const scanResult = await window.shellBridge.scanBarcode();

                    if (scanResult.data && scanResult.data.success) {
                        const barcode = scanResult.data.barcode;
                        setComplaintBarcode(barcode);
                        setMessage({ type: 'info', text: `Barcode: ${barcode}. Looking up product...` });

                        // Lookup product
                        try {
                            const product = await lookupProduct(barcode);
                            setComplaintProduct(product);
                            setMessage({ type: 'success', text: `Product found: ${product.name}` });
                        } catch (err) {
                            setComplaintProduct({ sku: barcode, name: 'Unknown Product' });
                            setMessage({ type: 'error', text: `Product not found for barcode ${barcode}` });
                        }
                    } else {
                        setMessage({ type: 'error', text: 'Scan failed' });
                    }
                } catch (err) {
                    setMessage({ type: 'error', text: `Scanner error: ${err.message}` });
                } finally {
                    setIsSubmitting(false);
                }
            };

            const captureComplaintPhoto = async () => {
                if (!isBridgeReady()) {
                    setMessage({ type: 'error', text: 'Photo capture not available' });
                    return;
                }

                try {
                    setIsSubmitting(true);
                    setMessage({ type: 'info', text: 'Opening camera...' });

                    const photoResult = await window.shellBridge.capturePhoto('complaint-' + Date.now());

                    if (photoResult.data && photoResult.data.success) {
                        setComplaintPhoto(photoResult.data);
                        setMessage({ type: 'success', text: 'Photo captured' });
                    } else {
                        setMessage({ type: 'error', text: 'Photo capture failed' });
                    }
                } catch (err) {
                    setMessage({ type: 'error', text: `Photo error: ${err.message}` });
                } finally {
                    setIsSubmitting(false);
                }
            };

            const submitComplaint = async () => {
                if (!complaintProduct || !complaintType || !complaintDescription) {
                    setMessage({ type: 'error', text: 'Product, complaint type, and description are required' });
                    return;
                }

                try {
                    setIsSubmitting(true);

                    const complaintData = {
                        id: 'comp-' + Date.now(),
                        barcode: complaintBarcode,
                        product_sku: complaintProduct.sku,
                        product_name: complaintProduct.name,
                        complaint_type: complaintType,
                        description: complaintDescription,
                        photo_path: complaintPhoto?.photoPath || null,
                        timestamp: Date.now(),
                        syncStatus: 'pending',
                        retryCount: 0,
                        lastError: null,
                        lastSyncAttempt: null,
                        createdAt: Date.now()
                    };

                    // Save to IndexedDB (offline-first)
                    console.log('[App] Complaint - Submit check: dbReady =', dbReady, ', offlineDB =', !!offlineDB);

                    if (dbReady && offlineDB) {
                        console.log('[App] ✅ Saving complaint to IndexedDB...');
                        await offlineDB.complaints.add(complaintData);
                        console.log('[App] ✅ Complaint saved to IndexedDB');

                        setMessage({
                            type: 'success',
                            text: `Complaint registered! ${networkOnline ? 'Syncing...' : 'Will sync when online.'}`
                        });

                        // Trigger sync if online
                        if (networkOnline && syncManagerRef.current) {
                            setTimeout(() => {
                                syncManagerRef.current.syncPendingComplaints();
                            }, 500);
                        }
                    } else {
                        // Fallback to direct HTTP
                        console.warn('[App] ❌ IndexedDB not ready for complaint, using direct HTTP');
                        const url = 'http://192.168.0.163:3000/api/complaints';
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(complaintData)
                        });

                        if (!response.ok) {
                            throw new Error('Failed to register complaint');
                        }
                        setMessage({ type: 'success', text: 'Complaint registered via HTTP!' });
                    }

                    setTimeout(() => {
                        setActiveView('menu');
                        // Reset form
                        setComplaintBarcode('');
                        setComplaintProduct(null);
                        setComplaintType('');
                        setComplaintDescription('');
                        setComplaintPhoto(null);
                        setMessage(null);
                    }, 2000);

                } catch (err) {
                    console.error('Complaint submit error:', err);
                    setMessage({ type: 'error', text: `Error: ${err.message}` });
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleSubmit = async () => {
                // Validation
                if (!transaction.poNumber.trim()) {
                    setMessage({ type: 'error', text: 'PO Number is required' });
                    return;
                }
                if (!transaction.vendor.trim()) {
                    setMessage({ type: 'error', text: 'Vendor is required' });
                    return;
                }
                if (transaction.lineItems.length === 0) {
                    setMessage({ type: 'error', text: 'At least one line item is required' });
                    return;
                }

                // Validate line items
                for (const item of transaction.lineItems) {
                    if (!item.sku.trim() || !item.quantity || !item.location.trim()) {
                        setMessage({ type: 'error', text: 'All line item fields are required' });
                        return;
                    }
                }

                setIsSubmitting(true);
                setMessage(null);

                try {
                    // Prepare transaction data
                    const transactionData = {
                        transactionId: `TXN-${Date.now()}`,
                        poNumber: transaction.poNumber.trim(),
                        vendor: transaction.vendor.trim(),
                        lineItems: transaction.lineItems.map(({ id, ...item }) => item),
                        createdAt: Date.now(),
                        syncStatus: 'pending',
                        retryCount: 0,
                        lastError: null,
                        lastSyncAttempt: null
                    };

                    // Save to IndexedDB (offline-first)
                    console.log('[App] Submit check: dbReady =', dbReady, ', offlineDB =', !!offlineDB, ', networkOnline =', networkOnline);

                    if (dbReady && offlineDB) {
                        console.log('[App] ✅ Saving transaction to IndexedDB...');
                        await offlineDB.transactions.add(transactionData);
                        console.log('[App] ✅ Transaction saved to IndexedDB');

                        // Success message
                        setMessage({
                            type: 'success',
                            text: `Transaction ${transaction.poNumber} saved! ${networkOnline ? 'Syncing...' : 'Will sync when online.'}`
                        });

                        // Trigger sync if online
                        if (networkOnline && syncManagerRef.current) {
                            setTimeout(() => {
                                syncManagerRef.current.syncPendingTransactions();
                            }, 500);
                        }

                        // Reload pending transactions
                        await loadPendingTransactions();
                        await updateSyncStatus();

                    } else {
                        // Fallback to direct HTTP if IndexedDB not available
                        console.warn('[App] ❌ IndexedDB not ready, using direct HTTP');
                        console.warn('[App] Reason: dbReady =', dbReady, ', offlineDB =', !!offlineDB);
                        await submitTransaction(transactionData);
                        setMessage({
                            type: 'success',
                            text: `Transaction ${transaction.poNumber} submitted via HTTP`
                        });
                    }

                    // Reset form
                    setTransaction({
                        poNumber: '',
                        vendor: '',
                        lineItems: []
                    });

                    // Reload history if on history tab
                    if (activeTab === 'history') {
                        setTimeout(loadHistory, 500);
                    }

                } catch (err) {
                    console.error('Submit error:', err);
                    setMessage({
                        type: 'error',
                        text: `Error: ${err.message}`
                    });
                } finally {
                    setIsSubmitting(false);
                }
            };

            // Network status badge component
            const NetworkStatusBadge = () => (
                <div style={{
                    display: 'inline-block',
                    padding: '6px 12px',
                    borderRadius: '4px',
                    fontSize: '14px',
                    fontWeight: '500',
                    marginTop: '8px',
                    background: networkOnline ? '#e8f5e9' : '#ffebee',
                    color: networkOnline ? '#2e7d32' : '#c62828'
                }}>
                    {networkOnline ? '🟢 Online' : '🔴 Offline'}
                    {dbReady && ` | 💾 DB Ready`}
                    {dbError && ` | ⚠️ DB Error`}
                </div>
            );

            // Sync progress indicator component
            const SyncProgressIndicator = () => {
                if (!syncStatus || syncStatus.syncing === 0) return null;

                return (
                    <div style={{
                        padding: '12px',
                        background: '#e3f2fd',
                        borderRadius: '4px',
                        marginTop: '12px',
                        borderLeft: '4px solid #2196f3'
                    }}>
                        <div style={{ marginBottom: '8px' }}>
                            Syncing {syncStatus.syncing} / {syncStatus.pending + syncStatus.syncing} items...
                        </div>
                        <div style={{
                            width: '100%',
                            height: '8px',
                            background: '#ddd',
                            borderRadius: '4px',
                            overflow: 'hidden'
                        }}>
                            <div style={{
                                width: `${(syncStatus.syncing / (syncStatus.pending + syncStatus.syncing)) * 100}%`,
                                height: '100%',
                                background: '#2196f3',
                                transition: 'width 0.3s'
                            }}></div>
                        </div>
                    </div>
                );
            };

            // Pending transactions list component
            const PendingTransactionsList = () => (
                <div className="form-section">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <h3>Pending Sync Queue ({pendingTransactions.length})</h3>
                        <button
                            className="feature-btn primary"
                            onClick={handleManualSync}
                            disabled={!networkOnline || !dbReady}
                        >
                            🔄 Sync Now
                        </button>
                    </div>

                    <NetworkStatusBadge />
                    <SyncProgressIndicator />

                    {syncStatus && (
                        <div style={{ marginTop: '12px', fontSize: '14px', color: '#666' }}>
                            <div style={{ fontWeight: '600', marginBottom: '8px' }}>
                                Total: Pending: {syncStatus.pending} | Syncing: {syncStatus.syncing} |
                                Synced: {syncStatus.synced} | Failed: {syncStatus.failed}
                            </div>
                            {(syncStatus.transactions.pending > 0 || syncStatus.transactions.syncing > 0 || syncStatus.transactions.failed > 0) && (
                                <div style={{ marginLeft: '12px', color: '#2196f3' }}>
                                    📋 Transactions: {syncStatus.transactions.pending} pending, {syncStatus.transactions.syncing} syncing, {syncStatus.transactions.failed} failed
                                </div>
                            )}
                            {(syncStatus.waterchecks.pending > 0 || syncStatus.waterchecks.syncing > 0 || syncStatus.waterchecks.failed > 0) && (
                                <div style={{ marginLeft: '12px', color: '#00bcd4' }}>
                                    💧 Water Checks: {syncStatus.waterchecks.pending} pending, {syncStatus.waterchecks.syncing} syncing, {syncStatus.waterchecks.failed} failed
                                </div>
                            )}
                            {(syncStatus.complaints.pending > 0 || syncStatus.complaints.syncing > 0 || syncStatus.complaints.failed > 0) && (
                                <div style={{ marginLeft: '12px', color: '#ff9800' }}>
                                    ⚠️ Complaints: {syncStatus.complaints.pending} pending, {syncStatus.complaints.syncing} syncing, {syncStatus.complaints.failed} failed
                                </div>
                            )}
                        </div>
                    )}

                    {pendingTransactions.length === 0 ? (
                        <div className="empty-state">
                            <p>No pending transactions</p>
                            <p style={{ fontSize: '14px', marginTop: '8px' }}>
                                All transactions have been synced
                            </p>
                        </div>
                    ) : (
                        <div className="transaction-history">
                            {pendingTransactions.map(tx => (
                                <div key={tx.transactionId} className="history-item" style={{
                                    borderLeft: `4px solid ${
                                        tx.syncStatus === 'syncing' ? '#2196f3' :
                                        tx.syncStatus === 'failed' ? '#f44336' :
                                        tx.syncStatus === 'synced' ? '#4caf50' : '#ff9800'
                                    }`
                                }}>
                                    <div className="history-item-header">
                                        <strong>PO: {tx.poNumber}</strong>
                                        <span style={{
                                            fontSize: '12px',
                                            padding: '4px 8px',
                                            borderRadius: '4px',
                                            background: tx.syncStatus === 'syncing' ? '#e3f2fd' :
                                                       tx.syncStatus === 'failed' ? '#ffebee' :
                                                       tx.syncStatus === 'synced' ? '#e8f5e9' : '#fff3e0',
                                            color: tx.syncStatus === 'syncing' ? '#1976d2' :
                                                   tx.syncStatus === 'failed' ? '#c62828' :
                                                   tx.syncStatus === 'synced' ? '#2e7d32' : '#f57c00'
                                        }}>
                                            {tx.syncStatus.toUpperCase()}
                                        </span>
                                    </div>
                                    <div className="history-item-details">
                                        <div><strong>Transaction ID:</strong> {tx.transactionId}</div>
                                        <div><strong>Vendor:</strong> {tx.vendor}</div>
                                        <div><strong>Line Items:</strong> {tx.lineItems?.length || 0} item(s)</div>
                                        <div><strong>Created:</strong> {new Date(tx.createdAt).toLocaleString()}</div>
                                        {tx.retryCount > 0 && (
                                            <div><strong>Retry Count:</strong> {tx.retryCount}</div>
                                        )}
                                        {tx.lastError && (
                                            <div style={{ color: '#c62828' }}><strong>Error:</strong> {tx.lastError}</div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    <button className="back-btn" onClick={() => setActiveView('menu')}>← Back to Menu</button>
                </div>
            );

            // Menu view component
            const MenuView = () => (
                <div className="menu-container">
                    <h2>Select Task</h2>

                    <NetworkStatusBadge />

                    <div className="menu-cards">
                        <div className="menu-card" onClick={() => setActiveView('receiving')}>
                            <div className="card-icon">📦</div>
                            <h3>Receiving Orders</h3>
                            <p>Create PO and receive items</p>
                            <button>Open</button>
                        </div>

                        <div className="menu-card" onClick={() => setActiveView('waterTemp')}>
                            <div className="card-icon">🌡️</div>
                            <h3>Water Temp Check</h3>
                            <p>Check and record temperature</p>
                            <button>Open</button>
                        </div>

                        <div className="menu-card" onClick={() => setActiveView('complaints')}>
                            <div className="card-icon">⚠️</div>
                            <h3>Register Complaint</h3>
                            <p>Scan barcode and report issue</p>
                            <button>Open</button>
                        </div>

                        <div className="menu-card" onClick={() => setActiveView('offlineQueue')}>
                            <div className="card-icon">💾</div>
                            <h3>Offline Sync Queue</h3>
                            <p>View pending transactions ({pendingTransactions.length})</p>
                            <button>Open</button>
                        </div>
                    </div>

                    <div style={{ marginTop: '40px', paddingTop: '20px', borderTop: '2px solid #e0e0e0' }}>
                        <h3 style={{ marginBottom: '20px' }}>View History</h3>
                        <div style={{ display: 'flex', gap: '12px', justifyContent: 'center' }}>
                            <button className="feature-btn primary" onClick={() => setActiveView('receivingHistory')}>
                                📦 Receiving History
                            </button>
                            <button className="feature-btn primary" onClick={() => setActiveView('waterTempHistory')}>
                                🌡️ Temp History
                            </button>
                            <button className="feature-btn primary" onClick={() => setActiveView('complaintsHistory')}>
                                ⚠️ Complaints History
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="warehouse-app">
                    <div className="header">
                        <h2>Warehouse Clerk Module</h2>
                        <div style={{ display: 'flex', gap: '12px', alignItems: 'center', flexWrap: 'wrap' }}>
                            <div className={`connection-status ${backendStatus}`}>
                                {backendStatus === 'connected' && 'Backend: Connected'}
                                {backendStatus === 'error' && 'Backend: Offline'}
                                {backendStatus === 'unknown' && 'Backend: Checking...'}
                            </div>
                            <NetworkStatusBadge />
                            {syncStatus && syncStatus.pending > 0 && (
                                <div style={{
                                    padding: '6px 12px',
                                    borderRadius: '4px',
                                    fontSize: '14px',
                                    background: '#fff3e0',
                                    color: '#f57c00',
                                    fontWeight: '500'
                                }}>
                                    📤 {syncStatus.pending} pending sync
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Menu View */}
                    {activeView === 'menu' && <MenuView />}

                    {/* Offline Sync Queue View */}
                    {activeView === 'offlineQueue' && <PendingTransactionsList />}

                    {/* Water Temperature Check View */}
                    {activeView === 'waterTemp' && (
                        <div className="form-section">
                            <button className="back-btn" onClick={() => setActiveView('menu')}>← Back to Menu</button>
                            <h3>Water Temperature Check</h3>

                            <button
                                className="feature-btn primary"
                                onClick={generateTemp}
                                disabled={isSubmitting}
                            >
                                🌡️ Check Temperature
                            </button>

                            {tempF && (
                                <div className="temp-display">
                                    <h3>{tempF}°F ({tempC}°C)</h3>
                                    <p>Water Temperature Reading</p>
                                </div>
                            )}

                            <div className="form-group">
                                <label>Location (optional)</label>
                                <input
                                    type="text"
                                    value={tempLocation}
                                    onChange={(e) => setTempLocation(e.target.value)}
                                    placeholder="Enter location"
                                    disabled={isSubmitting}
                                />
                            </div>

                            <button
                                className="feature-btn primary"
                                onClick={captureTempPhoto}
                                disabled={isSubmitting || !tempF}
                            >
                                📸 Capture Photo
                            </button>

                            {tempPhoto && (
                                <div className="photo-preview">
                                    <img src={tempPhoto.thumbnailPath} alt="Temperature check" />
                                </div>
                            )}

                            <button
                                className="feature-btn success"
                                onClick={submitTempCheck}
                                disabled={isSubmitting || !tempF || !tempPhoto}
                            >
                                {isSubmitting ? 'Submitting...' : 'Submit Check'}
                            </button>

                            {message && (
                                <div className={message.type}>
                                    {message.text}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Complaint Registration View */}
                    {activeView === 'complaints' && (
                        <div className="form-section">
                            <button className="back-btn" onClick={() => setActiveView('menu')}>← Back to Menu</button>
                            <h3>Register Complaint</h3>

                            <button
                                className="feature-btn primary"
                                onClick={scanComplaintBarcode}
                                disabled={isSubmitting}
                            >
                                📷 Scan Barcode
                            </button>

                            {complaintProduct && (
                                <div className="product-info">
                                    <p><strong>Barcode:</strong> {complaintBarcode}</p>
                                    <p><strong>Product SKU:</strong> {complaintProduct.sku}</p>
                                    <p><strong>Product Name:</strong> {complaintProduct.name}</p>
                                </div>
                            )}

                            <div className="form-group">
                                <label>Complaint Type *</label>
                                <select
                                    value={complaintType}
                                    onChange={(e) => setComplaintType(e.target.value)}
                                    disabled={isSubmitting || !complaintProduct}
                                >
                                    <option value="">Select Complaint Type</option>
                                    <option value="damaged">Damaged</option>
                                    <option value="defective">Defective</option>
                                    <option value="wrong_item">Wrong Item</option>
                                    <option value="missing_parts">Missing Parts</option>
                                    <option value="quality_issue">Quality Issue</option>
                                </select>
                            </div>

                            <div className="form-group">
                                <label>Description *</label>
                                <textarea
                                    placeholder="Describe the issue in detail"
                                    value={complaintDescription}
                                    onChange={(e) => setComplaintDescription(e.target.value)}
                                    disabled={isSubmitting || !complaintProduct}
                                />
                            </div>

                            <button
                                className="feature-btn primary"
                                onClick={captureComplaintPhoto}
                                disabled={isSubmitting || !complaintProduct}
                            >
                                📸 Capture Photo (Optional)
                            </button>

                            {complaintPhoto && (
                                <div className="photo-preview">
                                    <img src={complaintPhoto.thumbnailPath} alt="Complaint" />
                                </div>
                            )}

                            <button
                                className="feature-btn success"
                                onClick={submitComplaint}
                                disabled={isSubmitting || !complaintProduct || !complaintType || !complaintDescription}
                            >
                                {isSubmitting ? 'Submitting...' : 'Submit Complaint'}
                            </button>

                            {message && (
                                <div className={message.type}>
                                    {message.text}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Receiving Orders View */}
                    {activeView === 'receiving' && (
                        <>
                            <button className="back-btn" onClick={() => setActiveView('menu')}>← Back to Menu</button>

                            <div className="tabs">
                                <button
                                    className={`tab-button ${activeTab === 'create' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('create')}
                                >
                                    Create Transaction
                                </button>
                                <button
                                    className={`tab-button ${activeTab === 'history' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('history')}
                                >
                                    Transaction History ({submittedTransactions.length})
                                </button>
                            </div>
                        </>
                    )}

                    {activeView === 'receiving' && activeTab === 'create' && (
                        <div className="form-section">
                            <h3>New Receiving Transaction</h3>

                            <div className="form-group">
                                <label>PO Number *</label>
                                <input
                                    type="text"
                                    value={transaction.poNumber}
                                    onChange={(e) => setTransaction(prev => ({ ...prev, poNumber: e.target.value }))}
                                    placeholder="PO-20260318-001"
                                />
                            </div>

                            <div className="form-group">
                                <label>Vendor *</label>
                                <input
                                    type="text"
                                    value={transaction.vendor}
                                    onChange={(e) => setTransaction(prev => ({ ...prev, vendor: e.target.value }))}
                                    placeholder="Acme Manufacturing Corp"
                                />
                            </div>

                            <div className="line-items">
                                <div className="line-items-header">
                                    <h4>Line Items ({transaction.lineItems.length} / 50)</h4>
                                </div>

                                {transaction.lineItems.map(item => (
                                    <div key={item.id} style={{ marginBottom: '16px' }}>
                                        <div className="line-item">
                                            <div className="input-with-scan">
                                                <input
                                                    type="text"
                                                    value={item.sku}
                                                    onChange={(e) => updateLineItem(item.id, 'sku', e.target.value)}
                                                    placeholder="SKU"
                                                />
                                                <button
                                                    className="scan-btn"
                                                    onClick={() => handleBarcodeScan(item.id, setMessage, transaction, setTransaction, setIsSubmitting)}
                                                    disabled={isSubmitting}
                                                    title="Scan barcode"
                                                >
                                                    📷
                                                </button>
                                                <button
                                                    className="photo-btn"
                                                    onClick={() => handlePhotoCapture(item.id, setMessage, transaction, setTransaction, setIsSubmitting)}
                                                    disabled={isSubmitting || (item.photos && item.photos.length >= 5)}
                                                    title="Capture photo"
                                                >
                                                    📸
                                                </button>
                                            </div>
                                            <input
                                                type="text"
                                                value={item.description}
                                                onChange={(e) => updateLineItem(item.id, 'description', e.target.value)}
                                                placeholder="Description"
                                            />
                                            <input
                                                type="number"
                                                value={item.quantity}
                                                onChange={(e) => updateLineItem(item.id, 'quantity', e.target.value)}
                                                placeholder="Qty"
                                            />
                                            <div className="input-with-scan">
                                                <input
                                                    type="text"
                                                    value={item.location}
                                                    onChange={(e) => updateLineItem(item.id, 'location', e.target.value)}
                                                    placeholder="Location"
                                                />
                                                <button
                                                    className="scan-btn"
                                                    onClick={() => handleQRScan(item.id, setMessage, transaction, setTransaction, setIsSubmitting)}
                                                    disabled={isSubmitting}
                                                    title="Scan QR code"
                                                >
                                                    📱
                                                </button>
                                            </div>
                                            <button
                                                className="remove-btn"
                                                onClick={() => removeLineItem(item.id)}
                                            >
                                                ×
                                            </button>
                                        </div>
                                        {item.photos && item.photos.length > 0 && (
                                            <div className="photo-gallery">
                                                {item.photos.map((photo, idx) => (
                                                    <div key={idx} className="photo-thumbnail">
                                                        <img
                                                            src={photo.thumbnailPath}
                                                            alt={`Photo ${idx + 1}`}
                                                            onClick={() => showPhotoModal(photo.path)}
                                                        />
                                                        <button
                                                            className="photo-delete-btn"
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handlePhotoDelete(item.id, idx, setMessage, transaction, setTransaction);
                                                            }}
                                                            title="Delete photo"
                                                        >
                                                            🗑️
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))}

                                <button
                                    className="add-btn"
                                    onClick={addLineItem}
                                    disabled={transaction.lineItems.length >= 50}
                                >
                                    + Add Line Item
                                </button>

                                {transaction.lineItems.length >= 50 && (
                                    <div className="error">Maximum 50 line items reached</div>
                                )}
                            </div>

                            <button
                                className="submit-btn"
                                onClick={handleSubmit}
                                disabled={isSubmitting || transaction.lineItems.length === 0}
                            >
                                {isSubmitting ? 'Submitting...' : 'Submit Transaction'}
                            </button>

                            {message && (
                                <div className={message.type}>
                                    {message.text}
                                </div>
                            )}
                        </div>
                    )}

                    {(activeView === 'receiving' && activeTab === 'history') || activeView === 'receivingHistory' ? (
                        <div className="form-section">
                            {activeView === 'receivingHistory' && (
                                <button className="back-btn" onClick={() => setActiveView('menu')}>← Back to Menu</button>
                            )}
                            <h3>Receiving Transaction History</h3>

                            {isLoadingHistory && submittedTransactions.length === 0 ? (
                                <div className="loading">Loading transactions...</div>
                            ) : submittedTransactions.length === 0 ? (
                                <div className="empty-state">
                                    <p>No transactions submitted yet</p>
                                    <p style={{ fontSize: '14px', marginTop: '8px' }}>
                                        Submit a transaction from the Create tab to see it here
                                    </p>
                                </div>
                            ) : (
                                <div className="transaction-history">
                                    {submittedTransactions.map(tx => (
                                        <div key={tx.transactionId || tx.transaction_id} className="history-item">
                                            <div className="history-item-header">
                                                <strong>PO: {tx.poNumber || tx.po_number}</strong>
                                                <span style={{ fontSize: '12px', color: '#999' }}>
                                                    {formatTimestamp(tx.createdAt || tx.created_at)}
                                                </span>
                                            </div>
                                            <div className="history-item-details">
                                                <div><strong>Transaction ID:</strong> {tx.transactionId || tx.transaction_id}</div>
                                                <div><strong>Vendor:</strong> {tx.vendor}</div>
                                                <div><strong>Line Items:</strong> {tx.lineItems?.length || 0} item(s)</div>
                                                {tx.lineItems && tx.lineItems.length > 0 && (
                                                    <div style={{ marginTop: '8px', fontSize: '13px', color: '#666' }}>
                                                        {tx.lineItems.map((item, idx) => (
                                                            <div key={idx}>
                                                                <div style={{ marginLeft: '16px', marginBottom: '4px' }}>
                                                                    • {item.sku}: {item.description || 'N/A'} (Qty: {item.quantity}, Loc: {item.location})
                                                                </div>
                                                                {item.photos && item.photos.length > 0 && (
                                                                    <div className="photo-gallery" style={{ marginLeft: '32px', marginTop: '8px' }}>
                                                                        {item.photos.map((photo, photoIdx) => (
                                                                            <div key={photoIdx} className="photo-thumbnail">
                                                                                <img
                                                                                    src={photo.thumbnailPath || photo.path}
                                                                                    alt={`Photo ${photoIdx + 1}`}
                                                                                    onClick={() => showPhotoModal(photo.path)}
                                                                                />
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div className="refresh-info">Auto-refresh enabled</div>
                        </div>
                    ) : null}

                    {/* Water Temp History View */}
                    {activeView === 'waterTempHistory' && (
                        <div className="form-section">
                            <button className="back-btn" onClick={() => setActiveView('menu')}>← Back to Menu</button>
                            <h3>Water Temperature History</h3>

                            {waterTempChecks.length === 0 ? (
                                <div className="empty-state">
                                    <p>No temperature checks recorded yet</p>
                                </div>
                            ) : (
                                <div className="transaction-history">
                                    {waterTempChecks.map(check => (
                                        <div key={check.id} className="history-item">
                                            <div className="history-item-header">
                                                <strong>Water Temperature: {check.temp_fahrenheit}°F ({check.temp_celsius}°C)</strong>
                                                <span style={{ fontSize: '12px', color: '#999' }}>
                                                    {formatTimestamp(check.created_at)}
                                                </span>
                                            </div>
                                            <div className="history-item-details">
                                                <div><strong>Location:</strong> {check.location || 'Not specified'}</div>
                                                <div><strong>Check ID:</strong> {check.id}</div>
                                                {check.photo_path && (
                                                    <div className="photo-gallery" style={{ marginTop: '12px' }}>
                                                        <div className="photo-thumbnail">
                                                            <img
                                                                src={check.photo_path}
                                                                alt="Temperature check"
                                                                onClick={() => showPhotoModal(check.photo_path)}
                                                            />
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div className="refresh-info">Auto-refresh enabled</div>
                        </div>
                    )}

                    {/* Complaints History View */}
                    {activeView === 'complaintsHistory' && (
                        <div className="form-section">
                            <button className="back-btn" onClick={() => setActiveView('menu')}>← Back to Menu</button>
                            <h3>Complaints History</h3>

                            {complaints.length === 0 ? (
                                <div className="empty-state">
                                    <p>No complaints registered yet</p>
                                </div>
                            ) : (
                                <div className="transaction-history">
                                    {complaints.map(complaint => (
                                        <div key={complaint.id} className="history-item">
                                            <div className="history-item-header">
                                                <strong>{complaint.complaint_type.replace('_', ' ').toUpperCase()}</strong>
                                                <span style={{ fontSize: '12px', color: '#999' }}>
                                                    {formatTimestamp(complaint.created_at)}
                                                </span>
                                            </div>
                                            <div className="history-item-details">
                                                <div><strong>Barcode:</strong> {complaint.barcode}</div>
                                                <div><strong>Product:</strong> {complaint.product_name || 'Unknown'} ({complaint.product_sku || 'N/A'})</div>
                                                <div><strong>Description:</strong> {complaint.description}</div>
                                                <div><strong>Status:</strong> <span style={{
                                                    color: complaint.status === 'open' ? '#ff9800' : '#4caf50',
                                                    fontWeight: '500'
                                                }}>{complaint.status}</span></div>
                                                <div><strong>Complaint ID:</strong> {complaint.id}</div>
                                                {complaint.photo_path && (
                                                    <div className="photo-gallery" style={{ marginTop: '12px' }}>
                                                        <div className="photo-thumbnail">
                                                            <img
                                                                src={complaint.photo_path}
                                                                alt="Complaint"
                                                                onClick={() => showPhotoModal(complaint.photo_path)}
                                                            />
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div className="refresh-info">Auto-refresh enabled</div>
                        </div>
                    )}

                    {/* Phase 5.1: Photo modal */}
                    <div id="photo-modal" className="photo-modal" onClick={closePhotoModal}>
                        <div className="photo-modal-content" onClick={(e) => e.stopPropagation()}>
                            <button className="photo-modal-close" onClick={closePhotoModal}>×</button>
                            <img id="modal-photo" src="" alt="Full size photo" />
                        </div>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WarehouseApp />);

        console.log('[Warehouse Module] React app mounted - Direct HTTP mode');
        console.log('[Backend URL]', 'http://192.168.0.163:3000');
    </script>
</body>
</html>
